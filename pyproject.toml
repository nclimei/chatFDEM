[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatfdem"
version = "0.1.0"
description = "MVP natural-language-to-Gmsh workflow support for FDEM mesh generation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "chatFDEM contributors" }
]
dependencies = []

[project.scripts]
chatfdem = "chatfdem.cli:main"

[tool.setuptools.packages.find]
where = ["plugins/chatfdem/python"]
include = ["chatfdem*"]

[tool.pytest.ini_options]
pythonpath = ["plugins/chatfdem/python"]
